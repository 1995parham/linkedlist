---
name: ci
on:
  - push
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Generic methods require Go 1.27, which is only available as a release
    # candidate for now. Pin the rc and force GOTOOLCHAIN=local so the go
    # command uses the installed rc instead of trying to fetch a (nonexistent)
    # stable 1.27 to satisfy the `go 1.27` directive in go.mod.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0-rc.1"
      - run: go test -v ./... -covermode=atomic -coverprofile=coverage.out
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.out
